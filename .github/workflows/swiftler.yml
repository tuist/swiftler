name: Swiftler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  formatting:
    name: Check Formatting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.0'
          otp-version: '27.0'
      
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Check formatting
        run: mix format --check-formatted

  compile:
    name: Compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.0'
          otp-version: '27.0'
      
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Compile Elixir
        run: mix compile --warnings-as-errors
      
      - name: Build Swift package
        run: swift build -Xswiftc -warnings-as-errors
        working-directory: .

  test:
    name: Run Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.0'
          otp-version: '27.0'
      
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Run Swift tests
        run: swift test
        working-directory: .
      
      - name: Run Elixir tests
        run: mix test

  example:
    name: Test Example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.0'
          otp-version: '27.0'
      
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            example/calculator/deps
          key: ${{ runner.os }}-example-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-example-
      
      - name: Install Swiftler dependencies
        run: mix deps.get
      
      - name: Install example dependencies
        run: mix deps.get
        working-directory: example/calculator
      
      - name: Compile example
        run: mix compile
        working-directory: example/calculator
        env:
          SWIFTLER_BUILD_TIMEOUT: "600000"  # 10 minutes for first-time SwiftSyntax compilation
      
      - name: Run example tests
        run: mix test
        working-directory: example/calculator
        env:
          SWIFTLER_BUILD_TIMEOUT: "600000"  # 10 minutes for first-time SwiftSyntax compilation

name: Swiftler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  formatting:
    name: Check Formatting
    strategy:
      matrix:
        os: [namespace-profile-default-macos, namespace-profile-default]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check system info on Linux
        if: matrix.os == 'namespace-profile-default'
        run: |
          lsb_release -a
          cat /etc/os-release
          ldd --version

      - name: Set up Swift on Linux
        if: matrix.os == 'namespace-profile-default'
        run: |
          # Install Swift 6.1 on Linux (6.2 is not yet released)
          wget https://download.swift.org/swift-6.1-release/ubuntu2204/swift-6.1-RELEASE/swift-6.1-RELEASE-ubuntu22.04.tar.gz
          tar xzf swift-6.1-RELEASE-ubuntu22.04.tar.gz
          sudo mv swift-6.1-RELEASE-ubuntu22.04 /usr/share/swift
          echo "/usr/share/swift/usr/bin" >> $GITHUB_PATH
          # Test that Swift is working
          /usr/share/swift/usr/bin/swift --version

      - name: Install Elixir/Erlang on Linux
        if: matrix.os == 'namespace-profile-default'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3'
          
      - name: Set up Mise
        if: matrix.os != 'namespace-profile-default'
        uses: jdx/mise-action@v2

      - name: Install dependencies with Mise
        if: matrix.os != 'namespace-profile-default'
        run: mise install

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

  compile:
    name: Compile
    strategy:
      matrix:
        os: [namespace-profile-default-macos, namespace-profile-default]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        if: matrix.os == 'namespace-profile-default-macos'
        run: ls -la /Applications/ | grep Xcode || true

      - name: Select Xcode 26.0-Beta
        if: matrix.os == 'namespace-profile-default-macos'
        run: |
          # Try different possible Xcode 26.0-Beta paths
          if [ -d "/Applications/Xcode_26.0-beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0-beta.app
          elif [ -d "/Applications/Xcode-26.0-beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode-26.0-beta.app
          elif [ -d "/Applications/Xcode_26_beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26_beta.app
          else
            echo "Warning: Xcode 26.0-Beta not found, using default"
          fi
          swift --version

      - name: Check system info on Linux
        if: matrix.os == 'namespace-profile-default'
        run: |
          lsb_release -a
          cat /etc/os-release
          ldd --version

      - name: Set up Swift on Linux
        if: matrix.os == 'namespace-profile-default'
        run: |
          # Install Swift 6.1 on Linux (6.2 is not yet released)
          wget https://download.swift.org/swift-6.1-release/ubuntu2204/swift-6.1-RELEASE/swift-6.1-RELEASE-ubuntu22.04.tar.gz
          tar xzf swift-6.1-RELEASE-ubuntu22.04.tar.gz
          sudo mv swift-6.1-RELEASE-ubuntu22.04 /usr/share/swift
          echo "/usr/share/swift/usr/bin" >> $GITHUB_PATH
          # Test that Swift is working
          /usr/share/swift/usr/bin/swift --version

      - name: Install Elixir/Erlang on Linux
        if: matrix.os == 'namespace-profile-default'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3'
          
      - name: Set up Mise
        if: matrix.os != 'namespace-profile-default'
        uses: jdx/mise-action@v2

      - name: Install dependencies with Mise
        if: matrix.os != 'namespace-profile-default'
        run: mise install

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile Elixir
        run: mix compile --warnings-as-errors

      - name: Build Swift package
        run: swift build -Xswiftc -warnings-as-errors
        working-directory: .

  test:
    name: Run Tests
    strategy:
      matrix:
        os: [namespace-profile-default-macos, namespace-profile-default]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        if: matrix.os == 'namespace-profile-default-macos'
        run: ls -la /Applications/ | grep Xcode || true

      - name: Select Xcode 26.0-Beta
        if: matrix.os == 'namespace-profile-default-macos'
        run: |
          # Try different possible Xcode 26.0-Beta paths
          if [ -d "/Applications/Xcode_26.0-beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0-beta.app
          elif [ -d "/Applications/Xcode-26.0-beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode-26.0-beta.app
          elif [ -d "/Applications/Xcode_26_beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26_beta.app
          else
            echo "Warning: Xcode 26.0-Beta not found, using default"
          fi
          swift --version

      - name: Check system info on Linux
        if: matrix.os == 'namespace-profile-default'
        run: |
          lsb_release -a
          cat /etc/os-release
          ldd --version

      - name: Set up Swift on Linux
        if: matrix.os == 'namespace-profile-default'
        run: |
          # Install Swift 6.1 on Linux (6.2 is not yet released)
          wget https://download.swift.org/swift-6.1-release/ubuntu2204/swift-6.1-RELEASE/swift-6.1-RELEASE-ubuntu22.04.tar.gz
          tar xzf swift-6.1-RELEASE-ubuntu22.04.tar.gz
          sudo mv swift-6.1-RELEASE-ubuntu22.04 /usr/share/swift
          echo "/usr/share/swift/usr/bin" >> $GITHUB_PATH
          # Test that Swift is working
          /usr/share/swift/usr/bin/swift --version

      - name: Install Elixir/Erlang on Linux
        if: matrix.os == 'namespace-profile-default'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3'
          
      - name: Set up Mise
        if: matrix.os != 'namespace-profile-default'
        uses: jdx/mise-action@v2

      - name: Install dependencies with Mise
        if: matrix.os != 'namespace-profile-default'
        run: mise install

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Elixir tests
        run: mix test

  example:
    name: Test Example
    strategy:
      matrix:
        os: [namespace-profile-default-macos, namespace-profile-default]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        if: matrix.os == 'namespace-profile-default-macos'
        run: ls -la /Applications/ | grep Xcode || true

      - name: Select Xcode 26.0-Beta
        if: matrix.os == 'namespace-profile-default-macos'
        run: |
          # Try different possible Xcode 26.0-Beta paths
          if [ -d "/Applications/Xcode_26.0-beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0-beta.app
          elif [ -d "/Applications/Xcode-26.0-beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode-26.0-beta.app
          elif [ -d "/Applications/Xcode_26_beta.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26_beta.app
          else
            echo "Warning: Xcode 26.0-Beta not found, using default"
          fi
          swift --version

      - name: Check system info on Linux
        if: matrix.os == 'namespace-profile-default'
        run: |
          lsb_release -a
          cat /etc/os-release
          ldd --version

      - name: Set up Swift on Linux
        if: matrix.os == 'namespace-profile-default'
        run: |
          # Install Swift 6.1 on Linux (6.2 is not yet released)
          wget https://download.swift.org/swift-6.1-release/ubuntu2204/swift-6.1-RELEASE/swift-6.1-RELEASE-ubuntu22.04.tar.gz
          tar xzf swift-6.1-RELEASE-ubuntu22.04.tar.gz
          sudo mv swift-6.1-RELEASE-ubuntu22.04 /usr/share/swift
          echo "/usr/share/swift/usr/bin" >> $GITHUB_PATH
          # Test that Swift is working
          /usr/share/swift/usr/bin/swift --version

      - name: Install Elixir/Erlang on Linux
        if: matrix.os == 'namespace-profile-default'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3'
          
      - name: Set up Mise
        if: matrix.os != 'namespace-profile-default'
        uses: jdx/mise-action@v2

      - name: Install dependencies with Mise
        if: matrix.os != 'namespace-profile-default'
        run: mise install

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            example/calculator/deps
          key: ${{ runner.os }}-example-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-example-

      - name: Install Swiftler dependencies
        run: mix deps.get

      - name: Install example dependencies
        run: mix deps.get
        working-directory: example/calculator

      - name: Compile example
        run: mix compile
        working-directory: example/calculator

      - name: Run example tests
        run: mix test
        working-directory: example/calculator